<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SimClin Captura</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#0b1210;--bg2:#101a17;--card:#13201c;--line:#21352f;--ink:#e3efe9;--mute:#8aa59b;
  --acc:#00c46a;--acc2:#40c4ff;--warn:#ffb300;--bad:#ff4d5e;--chip:#1a2b26;
  --hr:#00e676;--spo:#40c4ff;--bp:#ff9800;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
html,body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
a{color:var(--acc2)}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--ink)}
h3{font-size:13px;margin:10px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 16px var(--mono);letter-spacing:1px;color:var(--acc);text-decoration:none}
.brand span{color:var(--acc2)}
.top .sp{flex:1}
.top label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.layout{display:flex;min-height:calc(100vh - 50px)}
nav{width:210px;flex-shrink:0;border-right:1px solid var(--line);padding:12px 8px;background:var(--bg2)}
nav button{display:flex;gap:10px;width:100%;align-items:center;background:none;border:0;color:var(--mute);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}
nav button:hover{background:var(--chip);color:var(--ink)}
nav button.on{background:var(--chip);color:var(--acc);font-weight:600}
nav .ico{width:18px;text-align:center}
main{flex:1;min-width:0;padding:20px 22px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:600 24px var(--mono);color:var(--acc)}
.kpi span{font-size:12px;color:var(--mute)}
.btn{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#04140c;font-weight:600}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f>span{font-size:12px;color:var(--mute)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.muted{color:var(--mute)}
.small{font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.tbl{overflow-x:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:11px;color:var(--mute)}
.tag.ok{color:var(--acc);border-color:#1f5a3c}.tag.warn{color:var(--warn);border-color:#5a4a1f}.tag.bad{color:var(--bad);border-color:#5a1f28}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.empty{padding:18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
ul.plain{list-style:none}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px;max-height:220px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dh{background:var(--bg2);padding:6px;font-size:12px;color:var(--mute);text-align:center}
.cal .dc{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;font-size:12px}
.cal .dc:nth-child(7n+1){border-left:0}
.cal .dc.out{opacity:.4}.cal .dc.today .dn{background:var(--acc);color:#04140c;border-radius:99px;padding:0 6px}
.chipev{display:block;margin-top:3px;padding:2px 5px;border-radius:5px;background:var(--chip);border-left:3px solid var(--acc2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipev.pend{border-left-style:dashed;opacity:.8}
/* modal */
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(760px,100%)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.conf{background:#3a1d22;border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2f29;border:1px solid var(--acc);padding:9px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
/* evaluation items */
.it{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;display:grid;grid-template-columns:1fr 130px 70px;gap:6px}
.it .opts{grid-column:1/3}
.it .ctl{display:flex;gap:8px;align-items:center;font-size:12px}
.q{padding:9px 0;border-bottom:1px solid var(--line)}
.q .qt{margin-bottom:5px}
.q .crit{color:var(--bad);font-size:11px;margin-left:6px}
.q .opts label{margin-right:12px;display:inline-flex;gap:4px;align-items:center}
/* live */
.live-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
#rec-clock{font:600 22px var(--mono)}
.live-grid{display:grid;grid-template-columns:1fr 340px;gap:14px}
.vgrid{display:grid;gap:6px;grid-template-columns:1fr 1fr;align-content:start}
.vgrid.n1{grid-template-columns:1fr}
.vtile{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.vtile video{width:100%;height:100%;object-fit:contain;background:#000}
.vtile .lbl{position:absolute;left:6px;top:6px;background:#000a;padding:1px 7px;border-radius:6px;font-size:12px}
.vtile .x{position:absolute;right:6px;top:6px}
.vtile input.lbl{border:0;width:60%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--mute);padding:7px 10px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tp{display:none}.tp.on{display:block}
.annbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.annbtns .btn{text-align:left;white-space:normal;border-left:4px solid var(--c,var(--acc2))}
.annbtns kbd{float:right;font:11px var(--mono);color:var(--mute)}
.log{max-height:360px;overflow:auto}
.log li{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.log li.sim{opacity:.8;font-size:12px}
.log li.act{background:#1d3a30}
.log .tm{font:12px var(--mono);color:var(--mute);min-width:44px}
.log .bar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.log .txt{flex:1}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vit div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.vit b{display:block;font:600 20px var(--mono)}
.vit span{font-size:11px;color:var(--mute)}
/* viewer */
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;display:grid;gap:3px}
.player.lay-grade{grid-template-columns:1fr 1fr}
.player.lay-grade.n1{grid-template-columns:1fr}
.player.lay-lado{grid-template-columns:repeat(var(--n,2),1fr)}
.player.lay-unica .vbox:not(.main){display:none}
.player.lay-pip{display:block}
.player.lay-pip .vbox:not(.main){position:absolute;width:24%;right:8px;bottom:8px;z-index:2;border:2px solid #fff3;border-radius:8px}
.player.lay-pip .vbox:not(.main)~.vbox:not(.main){bottom:auto;top:8px}
.vbox{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.vbox video{width:100%;height:100%;object-fit:contain;display:block}
.vbox .vlabel{position:absolute;left:6px;bottom:6px;background:#000a;padding:0 6px;border-radius:5px;font-size:11px}
.vbox.idle video{opacity:.25}.vbox.gone::after{content:"vídeo indisponível";position:absolute;inset:0;display:grid;place-items:center;color:var(--mute)}
.novideo{padding:40px;text-align:center;color:var(--mute)}
.ovl{position:absolute;right:8px;top:8px;z-index:3;background:#000c;border:1px solid #fff2;border-radius:8px;padding:4px 8px;font:12px var(--mono);display:flex;gap:10px}
.ovl:empty{display:none}
.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
#pb-time{font:14px var(--mono);min-width:120px}
#tl{width:100%;height:130px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:crosshair;touch-action:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:8px 0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.bars .b{display:grid;grid-template-columns:160px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bars .t{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--acc2)}
.bars .v{font-family:var(--mono);text-align:right}
@media (max-width:900px){
  .layout{flex-direction:column}
  nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  nav button{width:auto;white-space:nowrap}
  main{padding:14px 16px 60px}
  .cols,.cols3,.live-grid,.fg{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .cal .dc{min-height:60px}.chipev{font-size:10px}
  .bars .b{grid-template-columns:100px 1fr 56px}
}
@media print{nav,.top,.pctl{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Voltar ao monitor SimClin">SIM<span>CLIN</span> · Captura</a>
  <span class="sp"></span>
  <label>Perfil <select id="role" data-change="role">
    <option value="admin">Administrador</option><option value="docente">Docente</option><option value="estudante">Estudante</option>
  </select></label>
  <label id="me-wrap">Pessoa <select id="me" data-change="me"></select></label>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbody"></div></div>
<div id="ask" class="modal" hidden style="z-index:55"><div class="mbox" style="width:min(440px,100%)"><p id="ask-msg"></p>
  <div class="mact"><button type="button" class="btn ghost" id="ask-no">Cancelar</button><button type="button" class="btn danger" id="ask-yes">Confirmar</button></div></div></div>
<div id="toast"></div>

<script src="captura-core.js"></script>
<script src="scenarios.js"></script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
 * SimClin Captura – gestão, gravação e debriefing de simulação clínica
 *
 * Implementação aberta (clean-room) do fluxo descrito publicamente para
 * sistemas de gestão de simulação: agenda de salas/recursos → cenário →
 * gravação multicâmera sincronizada com dados do simulador e anotações com
 * carimbo de tempo → debriefing com reprodução sincronizada → avaliações
 * (checklists, escalas, reflexão) → relatórios.
 *
 * Tudo fica no navegador: metadados e vídeos em IndexedDB; gravação por
 * MediaRecorder; dados do simulador pela sala WebSocket do SimClin.
 * ════════════════════════════════════════════════════════════════════════ */
const C = window.CapturaCore;
const DAY = 86400000;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (ts) => new Date(ts).toLocaleDateString("pt-BR");
const fmtDT = (ts) => new Date(ts).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
const fmtHM = (ts) => new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const fmtH = (h) => h.toFixed(1).replace(".", ",") + " h";
const fmtMB = (b) => (b / 1048576).toFixed(1).replace(".", ",") + " MB";
const pad = (n) => String(n).padStart(2, "0");
const isoDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isoTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const PALETTE = ["#40c4ff", "#00e676", "#ffb300", "#ff4d5e", "#ba68c8", "#f06292", "#fff176", "#90a4ae", "#4db6ac"];
const colorFor = (s) => { let h = 0; for (const c of String(s || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

const ROLES = { admin: "Administrador", docente: "Docente", estudante: "Estudante", pe: "Paciente padronizado" };
const EVAL_TYPES = {
  antes: "Antes da sessão (estudante)", depois: "Após a sessão (estudante)", reflexao: "Reflexão (estudante)",
  avaliador: "Avaliador docente (checklist)", monitor: "Monitoramento ao vivo (equipe)",
};
const STUDENT_TYPES = ["antes", "depois", "reflexao"];
const ITEM_KINDS = { check: "Feito / não feito", escala: "Escala 0–N", multipla: "Múltipla escolha", texto: "Texto livre" };
const SIM_CATS = { evento: "Intervenção", estado: "Estado do cenário", resposta: "Resposta fisiológica", manual: "Ajuste do instrutor", comentario: "Comentário do instrutor", sistema: "Sistema" };

// ── Armazenamento (IndexedDB; memória como reserva) ──────────────────────
let USE_MEM = false;
const MEM = { kv: new Map(), media: new Map() };
let idbP = null;
function idb() {
  if (!idbP) idbP = new Promise((res, rej) => {
    const r = indexedDB.open("simclin-captura", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("media"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return idbP;
}
async function tx(store, mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const mediaRange = (id) => IDBKeyRange.bound([id, 0], [id, Infinity]);
const kvGet = (k) => USE_MEM ? Promise.resolve(MEM.kv.get(k)) : tx("kv", "readonly", (s) => s.get(k));
const kvPut = (k, v) => USE_MEM ? (MEM.kv.set(k, v), Promise.resolve()) : tx("kv", "readwrite", (s) => s.put(v, k));
const kvDel = (k) => USE_MEM ? (MEM.kv.delete(k), Promise.resolve()) : tx("kv", "readwrite", (s) => s.delete(k));
const putChunk = (id, seq, blob) => USE_MEM ? (MEM.media.set(id + "|" + String(seq).padStart(6, "0"), blob), Promise.resolve()) : tx("media", "readwrite", (s) => s.put(blob, [id, seq]));
const getChunks = (id) => USE_MEM
  ? Promise.resolve([...MEM.media.keys()].filter((k) => k.startsWith(id + "|")).sort().map((k) => MEM.media.get(k)))
  : tx("media", "readonly", (s) => s.getAll(mediaRange(id)));
const delMedia = (id) => USE_MEM
  ? ([...MEM.media.keys()].filter((k) => k.startsWith(id + "|")).forEach((k) => MEM.media.delete(k)), Promise.resolve())
  : tx("media", "readwrite", (s) => s.delete(mediaRange(id)));

let DB = null;
function emptyDB() {
  return { v: 1, locations: [], resources: [], people: [], courses: [], scenarios: [], evaluations: [], reservations: [], sessions: [],
    settings: { institution: "", retentionDays: 0, wsUrl: "" } };
}
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => kvPut("db", DB).catch((e) => toast("Falha ao salvar: " + e.message)), 150); }
const byId = (col, id) => (DB[col] || []).find((x) => x.id === id);
const nameOf = (col, id, f) => { const x = byId(col, id); return x ? x[f || (col === "courses" ? "title" : col === "scenarios" || col === "evaluations" ? "title" : "name")] : "—"; };

// ── Estado da interface ──────────────────────────────────────────────────
const UI = { view: "painel", role: "admin", me: "", sel: null, agMonth: null, agLoc: "", layout: "grade", main: 0, pbFilter: "all", vtab: "monitor",
  sesCourse: "", sesQ: "", repCourse: "", repEval: "" };
function loadPrefs() { try { Object.assign(UI, JSON.parse(localStorage.getItem("captura-ui") || "{}")); } catch (e) {} }
function savePrefs() { try { const { view, role, me, layout, agLoc } = UI; localStorage.setItem("captura-ui", JSON.stringify({ view, role, me, layout, agLoc })); } catch (e) {} }
const canEdit = () => UI.role !== "estudante";
const meLabel = () => (UI.me && nameOf("people", UI.me)) || ROLES[UI.role];

function toast(msg, ms = 3200) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), ms);
}
// No visualizador de Artifacts, links de download são bloqueados: usa a capacidade "downloads".
let DOWNLOADS = null;
try { if (window.claude && window.claude.use) window.claude.use("downloads").then((d) => { DOWNLOADS = d; }).catch(() => {}); } catch (e) {}
function download(name, data, type = "text/plain;charset=utf-8") {
  const b = data instanceof Blob ? data : new Blob([type.includes("csv") ? "\uFEFF" + data : data], { type });
  if (DOWNLOADS) {
    DOWNLOADS.save({ filename: name, data: b }).catch((e) => {
      if (e && e.code === "declined") return;
      toast(e && e.code === "rejected_extension" ? "Este formato não pode ser baixado nesta versão; use o arquivo HTML." : "Download indisponível aqui: " + ((e && e.message) || "erro"));
    });
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const opt = (v, label, sel) => `<option value="${esc(v)}" ${String(v) === String(sel ?? "") ? "selected" : ""}>${esc(label)}</option>`;
const opts = (col, sel, empty = "—") => opt("", empty, sel) + (DB[col] || []).map((x) => opt(x.id, x.title || x.name, sel)).join("");

// ── Navegação ────────────────────────────────────────────────────────────
const ALL = ["admin", "docente", "estudante"], STAFF = ["admin", "docente"];
const NAV = [
  ["painel", "Painel", "▦", ALL], ["agenda", "Agenda", "🗓", ALL], ["aovivo", "Sessão ao vivo", "●", STAFF],
  ["sessoes", "Sessões e debriefing", "▶", ALL], ["cursos", "Cursos e pessoas", "👥", STAFF], ["cenarios", "Cenários", "🎭", STAFF],
  ["avaliacoes", "Avaliações", "☑", STAFF], ["relatorios", "Relatórios", "📊", STAFF], ["config", "Configurações", "⚙", ["admin"]],
];
const R = {}, AFTER = {};
function go(view, sel) {
  if (LIVE.recording && view !== "aovivo") return toast("Encerre a gravação antes de sair da sessão ao vivo.");
  if (UI.view === "sessao" || view === "sessao") teardownPB();
  UI.view = view; if (sel !== undefined) UI.sel = sel;
  savePrefs(); render(); window.scrollTo(0, 0);
}
function render() {

// ── Confirmação na própria página (confirm() é bloqueado em alguns visualizadores) ──
function ask(msg, yes = "Confirmar") {
  return new Promise((res) => {
    const box = $("#ask"); $("#ask-msg").textContent = msg; $("#ask-yes").textContent = yes; box.hidden = false; $("#ask-no").focus();
    const done = (v) => { box.hidden = true; $("#ask-yes").onclick = $("#ask-no").onclick = null; ask.close = null; res(v); };
    $("#ask-yes").onclick = () => done(true); $("#ask-no").onclick = () => done(false); ask.close = () => done(false);
  });
}

// ── Modal ────────────────────────────────────────────────────────────────
let MODAL_SUBMIT = null, MODAL_CLOSE = null;
function modal(title, body, { submit = "Salvar", onSubmit = null, extra = "", onClose = null } = {}) {
  $("#mbody").innerHTML = `<form id="mform" novalidate><h2>${esc(title)}</h2>${body}
    <div class="mact">${extra}<button type="button" class="btn ghost" data-act="modal-close">${onSubmit ? "Cancelar" : "Fechar"}</button>
    ${onSubmit ? `<button class="btn primary" type="submit">${esc(submit)}</button>` : ""}</div></form>`;
  $("#modal").hidden = false; MODAL_SUBMIT = onSubmit; MODAL_CLOSE = onClose;
  const first = $("#mform input:not([type=hidden]),#mform select,#mform textarea"); if (first) first.focus();
}
function closeModal() { $("#modal").hidden = true; $("#mbody").innerHTML = ""; const c = MODAL_CLOSE; MODAL_SUBMIT = MODAL_CLOSE = null; if (c) c(); }
document.addEventListener("submit", (e) => {
  if (e.target.id !== "mform") return;
  e.preventDefault();
  const f = e.target, r = MODAL_SUBMIT ? MODAL_SUBMIT(new FormData(f), f) : true;
  Promise.resolve(r).then((v) => { if (v !== false) closeModal(); });
});

// ── Utilidades de domínio ────────────────────────────────────────────────
function visibleSessions() {
  return UI.role === "estudante" ? DB.sessions.filter((s) => (s.participantIds || []).includes(UI.me)) : DB.sessions;
}
function occurrencesBetween(a, b) {
  const out = [];
  for (const r of DB.reservations) {
    if (r.status === "negada") continue;
    if (UI.role === "estudante") { const c = byId("courses", r.courseId); if (!c || !(c.participantIds || []).includes(UI.me)) continue; }
    for (const o of C.expandRecurrence(r)) if (o.end > a && o.start < b) out.push({ ...o, res: r });
  }
  return out.sort((x, y) => x.start - y.start);
}
const kpi = (label, v) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(label)}</span></div>`;
function bars(obj, label = (k) => k, fmt = (v) => v) {
  const e = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!e.length) return `<div class="empty">Sem dados</div>`;
  const max = Math.max(...e.map((x) => x[1])) || 1;
  return `<div class="bars">${e.map(([k, v]) => `<div class="b"><span>${esc(label(k))}</span><div class="t"><i style="width:${(v / max) * 100}%"></i></div><span class="v">${esc(fmt(v))}</span></div>`).join("")}</div>`;
}

function openReservation(r, idx) {
  const isNew = !DB.reservations.includes(r);
  const recurring = !isNew && r.recur && r.recur.freq && r.recur.freq !== "nenhuma";
  const readonly = !canEdit();
  if (readonly) {
    return modal(r.title, `<p>${esc(nameOf("locations", r.locationId))} · ${fmtDT(+new Date(r.start))}–${fmtHM(+new Date(r.end))}</p><p class="muted">${esc(nameOf("courses", r.courseId))} · ${esc(nameOf("scenarios", r.scenarioId))}</p><p>${esc(r.notes || "")}</p>`);
  }
  const submit = (fd) => {
    const date = fd.get("date"), s = new Date(`${date}T${fd.get("t1")}`), e = new Date(`${date}T${fd.get("t2")}`);
    if (!(e > s)) { toast("O horário final deve ser depois do inicial."); return false; }
    const cand = { ...r, title: fd.get("title").trim() || "Reserva", courseId: fd.get("courseId"), scenarioId: fd.get("scenarioId"), locationId: fd.get("locationId"),
      color: fd.get("color"), start: s.toISOString(), end: e.toISOString(), resourceIds: fd.getAll("resourceIds"), notes: fd.get("notes"),
      recur: { freq: fd.get("freq"), until: fd.get("until"), skip: (r.recur || {}).skip || [] } };
    if (cand.recur.freq !== "nenhuma" && !cand.recur.until) { toast("Informe até quando a reserva se repete."); return false; }
    const conf = C.findConflicts(DB.reservations, cand, DB.resources);
    if (conf.length && !fd.get("override")) { show(cand, conf); return false; }
    if (isNew) { cand.status = UI.role === "admin" ? "aprovada" : "pendente"; cand.createdBy = meLabel(); DB.reservations.push(cand); }
    else Object.assign(r, cand);
    save(); render(); toast(cand.status === "pendente" ? "Reserva enviada para aprovação." : "Reserva salva.");
  };
  const extra = isNew ? "" : `${r.scenarioId || r.locationId ? `<button type="button" class="btn" data-act="live-from-res" data-id="${r.id}">● Iniciar sessão</button>` : ""}
    ${recurring ? `<button type="button" class="btn" data-act="res-del" data-id="${r.id}" data-idx="${idx}">Excluir esta ocorrência</button>` : ""}
    <button type="button" class="btn" data-act="res-del" data-id="${r.id}">Excluir${recurring ? " série" : ""}</button>`;
  const show = (data, conf) => modal(conf ? "Verificar conflito de agenda" : isNew ? "Nova reserva" : "Editar reserva", reservationForm(data, conf), { onSubmit: submit, extra });
  show(r);
}

function importRoster(text) {

function importEngineScenarios() {

    const anns = [...(p.events || []).map((e) => [e.label, e.cat || "Intervenção"]), ...CRM_MARKERS]
      .map(([label, cat]) => ({ id: C.uid("a"), label, cat, color: colorFor(cat) }));
    DB.scenarios.push({ id: C.uid("sc"), engineId: p.id, title: p.title, simulator: "SimClin (monitor) – modo automático", summary: p.summary || "",

function evalFormHtml(ev, answers = {}, ro = false) {
  const dis = ro ? "disabled" : "";
  return `${ev.instructions ? `<p class="muted small">${esc(ev.instructions)}</p>` : ""}${ev.items.map((it, n) => {
    const a = answers[it.id];
    let ctl = "";
    if (it.kind === "check") ctl = `<label><input type="checkbox" name="${it.id}" ${a === true ? "checked" : ""} ${dis}> Realizado <span class="muted small">(${it.points || 1} pt)</span></label>`;
    if (it.kind === "escala") ctl = `<div class="opts">${Array.from({ length: (+it.max || 5) + 1 }, (_, v) => `<label><input type="radio" name="${it.id}" value="${v}" ${a !== undefined && +a === v ? "checked" : ""} ${dis}>${v}</label>`).join("")}</div>`;
    if (it.kind === "multipla") ctl = `<div class="opts">${(it.options || []).map((o, i) => `<label><input type="radio" name="${it.id}" value="${i}" ${a !== undefined && a !== "" && +a === i ? "checked" : ""} ${dis}>${esc(o.label)}</label>`).join("")}</div>`;
    if (it.kind === "texto") ctl = `<textarea name="${it.id}" ${dis}>${esc(a || "")}</textarea>`;
    return `<div class="q"><div class="qt">${n + 1}. ${esc(it.text)}${it.critical ? `<span class="crit">● crítico</span>` : ""}</div>${ctl}</div>`;
  }).join("")}`;
}
function readAnswers(form, ev) {
  const out = {};
  for (const it of ev.items) {
    const el = form.elements[it.id];
    if (!el) continue;
    if (it.kind === "check") out[it.id] = el.checked;
    else if (it.kind === "texto") out[it.id] = el.value.trim();
    else { const r = $$(`input[name="${it.id}"]:checked`, form)[0]; if (r) out[it.id] = +r.value; }
  }
  return out;
}
function printEvaluation(ev, answers, header = "") {
  const w = window.open("", "_blank");

  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(ev.title)}</title><style>body{font:14px system-ui;margin:30px;color:#111}h1{font-size:20px}.q{padding:8px 0;border-bottom:1px solid #ddd}.crit{color:#b00;font-size:11px;margin-left:6px}label{margin-right:12px}textarea{width:100%;min-height:60px}</style>

  w.document.close();
}

async function detectCams() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast("Este navegador não oferece acesso a câmeras neste endereço.");
  try { const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); s.getTracks().forEach((t) => t.stop()); }
  catch (e) { try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach((t) => t.stop()); } catch (e2) { toast("Câmera indisponível ou permissão negada: " + e2.message); } }
  const d = await navigator.mediaDevices.enumerateDevices();
  LIVE.devices = d.filter((x) => x.kind === "videoinput"); LIVE.mics = d.filter((x) => x.kind === "audioinput");
  if (!LIVE.devices.length) toast("Nenhuma câmera encontrada.");
  render();
}
function addSource(src) {
  if (LIVE.sources.length >= 4) { src.stream.getTracks().forEach((t) => t.stop()); return toast("Máximo de 4 fontes de vídeo por sessão."); }
  src.id = C.uid("src"); LIVE.sources.push(src);
  src.stream.getVideoTracks()[0]?.addEventListener("ended", () => { if (!LIVE.recording) { LIVE.sources = LIVE.sources.filter((x) => x !== src); if (UI.view === "aovivo") render(); } });
  render();
}
async function addCam(deviceId, label) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } });

async function recStart() {
  const s = LIVE.setup;

  if (LIVE.sources.length && !window.MediaRecorder) return toast("Este navegador não grava vídeo (MediaRecorder ausente).");
  let mic = null;
  if (LIVE.micId !== "none" && navigator.mediaDevices) {
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: LIVE.micId ? { deviceId: { exact: LIVE.micId } } : true, video: false }); }
    catch (e) { toast("Microfone indisponível; gravando sem áudio."); }
  }
  if (!LIVE.sources.length && !mic && !(LIVE.sim && LIVE.sim.status === "conectado")) {
    stopStream(mic); return toast("Adicione uma câmera, o microfone ou conecte o simulador.");
  }
  LIVE.mic = mic;
  const ses = { id: C.uid("s"), title: s.title.trim() || "Sessão " + fmtDT(Date.now()), courseId: s.courseId, scenarioId: s.scenarioId, locationId: s.locationId,
    participantIds: [...s.pids], reservationId: s.reservationId, startedAt: Date.now(), duration: 0, media: [], annotations: [], samples: [], transcript: [], results: [],
    notes: "", consent: true, createdBy: meLabel(), simRoom: LIVE.sim && LIVE.sim.status === "conectado" ? LIVE.sim.room : "" };
  LIVE.session = ses; LIVE.t0 = performance.now(); LIVE.pending = []; LIVE.recorders = []; LIVE.storageErr = false;
  const plan = LIVE.sources.map((src, i) => ({ label: src.label, kind: src.kind, tracks: [...src.stream.getVideoTracks(), ...(i === 0 && mic ? mic.getAudioTracks() : [])], hasAudio: i === 0 && !!mic }));
  if (!plan.length && mic) plan.push({ label: "Áudio", kind: "audio", tracks: mic.getAudioTracks(), hasAudio: true, audioOnly: true });
  for (const p of plan) {
    const mime = pickMime(p.audioOnly), media = { id: C.uid("m"), label: p.label, kind: p.kind, mime, offset: 0, size: 0, chunks: 0, hasAudio: p.hasAudio };
    let rec;
    try { rec = new MediaRecorder(new MediaStream(p.tracks), mime ? { mimeType: mime, videoBitsPerSecond: 1500000, audioBitsPerSecond: 96000 } : undefined); }
    catch (e) { toast(`Falha ao gravar ${p.label}: ${e.message}`); continue; }
    media.mime = rec.mimeType || mime || "video/webm";

  if (LIVE.sim && LIVE.sim.status === "conectado") addAnn({ label: `Simulador ligado (sala ${LIVE.sim.room})`, cat: "Sistema", source: "simulador" });

// ── Simulador (sala WebSocket do SimClin) ───────────────────────────────
function wsBase() {
  if (DB.settings.wsUrl) return DB.settings.wsUrl;
  if (location.protocol === "https:") return "wss://" + location.host;
  if (location.protocol === "http:") return "ws://" + location.host;
  return "";
}
function simConnect(room) {
  if (!/^\d{4}$/.test(room)) return toast("Informe o código de 4 dígitos da sala.");
  const url = wsBase(); if (!url) return toast("Abra esta página pelo servidor SimClin para ligar ao simulador.");
  simClose();
  let ws; try { ws = new WebSocket(url); } catch (e) { return toast("Endereço WebSocket inválido."); }
  const sim = LIVE.sim = { ws, room, status: "conectando", vitals: null, retry: 0 };
  ws.onopen = () => { ws.send(JSON.stringify({ type: "join", room, role: "captura" })); sim.status = "conectado"; renderSim(); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.type === "state" && m.state) simState(m.state);
    if (m.type === "event" && m.entry) simEvent(m.entry);
  };
  ws.onclose = () => {
    if (LIVE.sim !== sim) return;
    sim.status = "desconectado"; renderSim();
    if (LIVE.recording && sim.retry++ < 10) setTimeout(() => { if (LIVE.sim === sim) { const keep = sim.vitals; simConnect(room); LIVE.sim.vitals = keep; } }, 2000);
  };
  ws.onerror = () => {};
  renderSim();
}
function simClose() { const s = LIVE.sim; LIVE.sim = null; if (s && s.ws) { try { s.ws.close(); } catch (e) {} } renderSim(); }
function simState(st) {
  LIVE.sim.vitals = st;

  renderSim();
}

  const cat = SIM_CATS[en.kind] || "Simulador";
  LIVE.session.annotations.push({ id: C.uid("n"), t: Math.round(liveT() * 10) / 10, simT: en.t, label: en.text, cat, color: en.kind === "evento" ? "#40c4ff" : en.kind === "estado" ? "#ba68c8" : "#607d8b",
    text: "", source: "simulador", author: "Simulador", kind: en.kind });
  renderLiveLog();
}

// ── Transcrição ao vivo (Web Speech API) ────────────────────────────────
function startTranscript() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Reconhecimento de fala indisponível neste navegador (use Chrome ou Edge).");
  const r = new SR(); r.lang = "pt-BR"; r.continuous = true; r.interimResults = false;
  r.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) {
      const text = e.results[i][0].transcript.trim();
      if (text) { LIVE.session.transcript.push({ t: Math.round(liveT() * 10) / 10, text }); renderTr(); }
    }
  };
  r.onerror = (e) => { if (e.error === "not-allowed") { toast("Permissão de microfone negada para transcrição."); stopTranscript(); } };
  r.onend = () => { if (LIVE.tr === r) try { r.start(); } catch (e) {} };
  LIVE.tr = r; try { r.start(); } catch (e) {}
  const b = $("#tr-btn"); if (b) b.textContent = "■ Parar transcrição";
}

    { text: "Reavalia PAM e perfusão após o volume", kind: "check", points: 1 },

    { text: "Comunicação", kind: "escala", max: 4 }, { text: "Distribuição de tarefas", kind: "escala", max: 4 } ], "0 = ausente; 4 = exemplar.");
  const evPre = E("Pré-teste – sepse", "antes", [
    { text: "Meta de PAM no choque séptico", kind: "multipla", options: [{ label: "≥ 65 mmHg", points: 1 }, { label: "≥ 90 mmHg", points: 0 }, { label: "≥ 50 mmHg", points: 0 }] },
    { text: "Volume inicial de cristaloide recomendado", kind: "multipla", options: [{ label: "30 mL/kg", points: 1 }, { label: "10 mL/kg", points: 0 }, { label: "500 mL fixos", points: 0 }] } ]);
  const evRef = E("Reflexão pós-simulação", "reflexao", [
    { text: "O que aconteceu no cenário e como você se sentiu?", kind: "texto" }, { text: "Que decisões você tomaria de forma diferente? Por quê?", kind: "texto" },
    { text: "Como aplicará o que aprendeu na prática clínica?", kind: "texto" } ]);
  if (window.SCENARIO_PROGRAMS) importEngineScenarios();
  let sep = DB.scenarios.find((s) => /seps/i.test(s.title));
  if (!sep) { sep = { id: C.uid("sc"), title: "Sepse com hipotensão", simulator: "Manequim adulto", summary: "Paciente com foco urinário evoluindo com hipotensão.", objectives: ["Reconhecer sepse", "Aplicar pacote da 1ª hora"],
    annotations: CRM_MARKERS.map(([label, cat]) => ({ id: C.uid("a"), label, cat, color: colorFor(cat) })), evaluationIds: [], retentionDays: 0 }; DB.scenarios.push(sep); }
  sep.evaluationIds = [evSep.id, evCrm.id, evPre.id, evRef.id];
  DB.scenarios.filter((s) => s !== sep && !(s.evaluationIds || []).length).forEach((s) => (s.evaluationIds = [evCrm.id, evRef.id]));
  const course = { id: C.uid("c"), code: "ENF-SIM-01", title: "Simulação em Urgência e Emergência", term: "2026/2", participantIds: st.map((p) => p.id), facultyIds: fac.map((p) => p.id) };
  DB.courses.push(course);
  const L = DB.locations, Rs = DB.resources;
  const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); d.setHours(8, 0, 0, 0);
  const until = new Date(+d + 56 * DAY);
  DB.reservations.push({ id: C.uid("r"), title: "ENF-SIM-01 · Sepse", courseId: course.id, scenarioId: sep.id, locationId: L[0].id, resourceIds: [Rs[0].id, Rs[1].id], color: "#00c46a",
    start: d.toISOString(), end: new Date(+d + 2 * 3600000).toISOString(), recur: { freq: "semanal", until: isoDate(+until), skip: [] }, status: "aprovada", notes: "Turma A" });
  const d2 = new Date(+d + DAY + 5 * 3600000);
  DB.reservations.push({ id: C.uid("r"), title: "ENF-SIM-01 · Treino de habilidades", courseId: course.id, scenarioId: "", locationId: L[1].id, resourceIds: [Rs[3].id], color: "#ffb300",
    start: d2.toISOString(), end: new Date(+d2 + 3600000).toISOString(), recur: { freq: "nenhuma" }, status: "pendente", notes: "Solicitado por docente" });
  // sessão gravada sintética (sem vídeo): deterioração e resposta ao volume
  const dur = 720, samples = [];
  const lerp = (a, b, x) => a + (b - a) * Math.max(0, Math.min(1, x));
  for (let t = 0; t <= dur; t += 5) {
    const worse = t / 260, better = (t - 280) / 300, fx = t < 280;
    samples.push({ t, rhythm: "sinusal",
      hr: Math.round(fx ? lerp(118, 132, worse) : lerp(132, 102, better)), spo2: Math.round(fx ? lerp(92, 88, worse) : lerp(88, 95, better)),
      sbp: Math.round(fx ? lerp(92, 78, worse) : lerp(78, 108, better)), dbp: Math.round(fx ? lerp(55, 44, worse) : lerp(44, 64, better)),
      rr: Math.round(fx ? lerp(26, 30, worse) : lerp(30, 20, better)), temp: 38.6 });
  }
  const A = (t, label, cat, source = "manual", text = "") => ({ id: C.uid("n"), t, label, cat, color: source === "simulador" ? (cat === "Estado do cenário" ? "#ba68c8" : "#40c4ff") : colorFor(cat), text, source, author: source === "simulador" ? "Simulador" : fac[0].name });
  const ses = { id: C.uid("s"), title: "ENF-SIM-01 · Sepse · Turma A", courseId: course.id, scenarioId: sep.id, locationId: L[0].id, participantIds: st.slice(0, 4).map((p) => p.id),

    annotations: [A(0, "Cenário iniciado", "Sistema", "simulador"), A(30, "Avaliação inicial (ABCDE)", "Intervenção", "simulador"), A(42, "Comunicação em alça fechada", "Trabalho em equipe", "manual", "Confirmou a prescrição em voz alta"),
      A(150, "Coleta de lactato/hemoculturas", "Intervenção", "simulador"), A(200, "→ Choque séptico", "Estado do cenário", "simulador"), A(215, "Ponto para o debriefing", "Debriefing", "manual", "Demora na reposição volêmica"),
      A(262, "Cristaloide 30 mL/kg", "Intervenção", "simulador"), A(300, "Liderança clara", "Trabalho em equipe", "manual"), A(410, "Erro / omissão", "Segurança do paciente", "manual", "Antimicrobiano após 60 min"),
      A(420, "Antimicrobiano", "Intervenção", "simulador"), A(600, "→ Estabilização", "Estado do cenário", "simulador"), A(700, "Boa prática", "Destaque", "manual", "Reavaliação da PAM após volume")],
    results: [], notes: "Reação: equipe ansiosa no início.\nAnálise: atraso no antimicrobiano; boa comunicação.\nSíntese: aplicar o pacote da 1ª hora com checklist visual.", consent: true, createdBy: fac[0].name };
  const R0 = (ev, subj, answers, t) => ({ id: C.uid("res"), evaluationId: ev.id, subjectId: subj, evaluatorId: fac[0].id, evaluator: fac[0].name, role: "docente", answers: Object.fromEntries(ev.items.map((it, i) => [it.id, answers[i]]).filter((x) => x[1] !== undefined)), submittedAt: ses.startedAt + dur * 1000, ...(t !== undefined ? { t } : {}) });
  ses.results.push(R0(evSep, st[0].id, [true, true, true, false, true, 3, 0, "Atrasou o antimicrobiano."], 700), R0(evSep, st[1].id, [true, true, true, true, false, 4, 1, ""]),
    R0(evCrm, "equipe", [3, 2, 4, 3], 650), R0(evPre, st[0].id, [0, 0]), R0(evPre, st[1].id, [0, 1]), R0(evPre, st[2].id, [0, 0]), R0(evRef, st[0].id, ["Fiquei nervosa no início.", "Prescreveria o antimicrobiano mais cedo.", "Usarei o checklist do pacote."]));
  ses.results.slice(3).forEach((r) => { r.evaluatorId = r.subjectId; r.evaluator = nameOf("people", r.subjectId); r.role = "estudante"; });
  DB.sessions.unshift(ses);
  save(); render(); toast("Dados de exemplo carregados.");
}

    download("resultados-avaliacoes.csv", C.toCSV(rows), "text/csv;charset=utf-8"); },
  // configurações
  "retention": () => applyRetention(false),
  "persist": async () => { try { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? "Armazenamento persistente concedido." : "O navegador não concedeu armazenamento persistente."); render(); } catch (e) { toast(e.message); } },
  "backup": () => download(`simclin-captura-backup-${isoDate(Date.now())}.json`, JSON.stringify(DB, null, 1), "application/json"),
  "wipe": async () => { if (!(await ask("Apagar TODOS os dados e vídeos deste navegador?")) || !(await ask("Confirma? Não há como desfazer."))) return;
    if (USE_MEM) { MEM.kv.clear(); MEM.media.clear(); } else { await tx("media", "readwrite", (s) => s.clear()); await kvDel("db"); }
    DB = emptyDB(); seedBasics(); save(); render(); toast("Dados apagados."); },
  "loc-new": () => modal("Nova sala", `<label class="f"><span>Nome</span><input name="name" required></label>`, { onSubmit: (fd) => { const n = fd.get("name").trim(); if (!n) return false; DB.locations.push({ id: C.uid("l"), name: n }); save(); render(); } }),
  "loc-del": async (b) => { if (!(await ask("Remover a sala?"))) return; DB.locations = DB.locations.filter((x) => x.id !== b.dataset.id); save(); render(); },
  "resrc-new": () => modal("Novo recurso", `<label class="f"><span>Nome</span><input name="name" required></label><label class="f"><span>Tipo</span><select name="kind">${opt("capital", "Permanente (simulador, câmera, monitor)")}${opt("consumivel", "Insumo (consumível)")}</select></label>`,
    { onSubmit: (fd) => { const n = fd.get("name").trim(); if (!n) return false; DB.resources.push({ id: C.uid("rs"), name: n, kind: fd.get("kind") }); save(); render(); } }),
  "resrc-del": async (b) => { if (!(await ask("Remover o recurso?"))) return; DB.resources = DB.resources.filter((x) => x.id !== b.dataset.id); save(); render(); },
};
// "res-new" atende à agenda/painel (nova reserva) e ao visualizador (novo resultado)
ACT["res-new"] = (b, e) => {
  if (UI.view === "sessao") { const s = byId("sessions", UI.sel); return openEvalFor(s, $("#v-ev").value, $("#v-subj").value, () => { $("#vtab").innerHTML = vtabHtml(s); renderEvList(); updatePBUI(true); }); }
  if (e.target.closest(".chipev")) return;
  newReservation(b.dataset.date);
};

const CHG = {
  "role": (el) => { UI.role = el.value; UI.me = ""; if (UI.view === "sessao") teardownPB(); savePrefs(); render(); },
  "me": (el) => { UI.me = el.value; savePrefs(); if (UI.view === "sessao") teardownPB(); render(); },
  "ag-loc": (el) => { UI.agLoc = el.value; savePrefs(); render(); },
  "lv": (el) => { LIVE.setup[el.name] = el.value; if (el.name === "courseId") { const c = byId("courses", el.value); LIVE.setup.pids = c ? [...(c.participantIds || [])] : []; render(); } },
  "lv-pid": (el) => { const p = LIVE.setup.pids; if (el.checked) { if (!p.includes(el.value)) p.push(el.value); } else LIVE.setup.pids = p.filter((x) => x !== el.value); },
  "lv-consent": (el) => { LIVE.setup.consent = el.checked; },
  "lv-mic": (el) => { LIVE.micId = el.value; },
  "src-label": (el) => { const s = LIVE.sources.find((x) => x.id === el.dataset.id); if (s) s.label = el.value.trim() || s.label; },
  "ses-q": (el) => { UI.sesQ = el.value; render(); const i = $("[data-change=ses-q]"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); },
  "ses-course": (el) => { UI.sesCourse = el.value; render(); },
  "ses-notes": (el) => { const s = byId("sessions", UI.sel); if (s) { s.notes = el.value; save(); } },
  "pb-rate": (el) => { if (PB) { PB.rate = +el.value; syncVideos(true); } },
  "pb-layout": (el) => { UI.layout = el.value; savePrefs(); const p = $("#player"); p.className = p.className.replace(/lay-\w+/, "lay-" + UI.layout); },
  "rep-course": (el) => { UI.repCourse = el.value; render(); },
  "rep-eval": (el) => { UI.repEval = el.value; render(); },
  "set": (el) => { DB.settings[el.name] = el.type === "number" ? +el.value || 0 : el.value.trim(); save(); },
  "roster": (el) => { const f = el.files[0]; if (f) f.text().then(importRoster); el.value = ""; },
  "restore": (el) => { const f = el.files[0]; if (!f) return; f.text().then(async (t) => { try { const d = JSON.parse(t); if (!d || !Array.isArray(d.sessions)) throw new Error("arquivo inválido"); if (!(await ask("Substituir os dados atuais pelo backup?"))) return; DB = Object.assign(emptyDB(), d); save(); render(); toast("Backup restaurado."); } catch (e) { toast("Não foi possível restaurar: " + e.message); } }); el.value = ""; },
};

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { if (b.tagName === "A") e.preventDefault(); fn(b, e); }
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-change]"); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el); });
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== "checkbox" && e.target.type !== "radio";
  if (!$("#ask").hidden) { if (e.key === "Escape" && ask.close) ask.close(); return; }
  if (e.key === "Escape" && !$("#modal").hidden) return closeModal();
  if (!$("#modal").hidden) return;
  if (LIVE.recording) {
    if (e.target.id === "ann-text" && e.key === "Enter") { e.preventDefault(); ACT["ann-free"](); return; }
    if (!typing && /^[1-9]$/.test(e.key)) { const b = $$("[data-act=ann-pre]")[+e.key - 1]; if (b) { b.click(); b.animate([{ opacity: .4 }, { opacity: 1 }], 300); } }
    return;
  }
  if (UI.view === "sessao" && PB && !typing) {
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
    if (e.key === "ArrowLeft") seek(PB.t - 5);
    if (e.key === "ArrowRight") seek(PB.t + 5);
  }
});
window.addEventListener("beforeunload", (e) => { if (LIVE.recording) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", () => { if (PB) drawTimeline(); });

// ═════════════════════════════ INÍCIO ═════════════════════════════════════
(async function boot() {
  loadPrefs();
  try { if (!window.indexedDB) throw new Error("sem IndexedDB"); await idb(); } catch (e) { USE_MEM = true; }
  try { DB = await kvGet("db"); } catch (e) { DB = null; }
  if (!DB) { DB = emptyDB(); seedBasics(); save(); }
  DB = Object.assign(emptyDB(), DB); DB.settings = Object.assign(emptyDB().settings, DB.settings);
  try { // recupera gravação interrompida (fechamento da aba, queda de energia)
    const draft = await kvGet("draft");
    if (draft && !DB.sessions.some((s) => s.id === draft.id)) {
      draft.title += " (recuperada)";
      for (const m of draft.media) { const ch = await getChunks(m.id); m.chunks = ch.length; m.size = ch.reduce((a, b) => a + b.size, 0); }
      draft.media = draft.media.filter((m) => m.chunks);
      DB.sessions.unshift(draft); save(); setTimeout(() => toast("Uma gravação interrompida foi recuperada em Sessões.", 6000), 300);
    }
    if (draft) await kvDel("draft");
  } catch (e) {}
  if (UI.view === "sessao" && !byId("sessions", UI.sel)) UI.view = "painel";
  if (UI.view === "aovivo" && UI.role === "estudante") UI.view = "painel";
  render();
  applyRetention(true);
})();
</script>
</body>
</html>
